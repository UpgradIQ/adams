<!doctype html><meta charset=utf-8><link rel=stylesheet href=base.css>
<style>
#frame{width:1600px;height:392px;padding:0}
.row{position:absolute;left:70px;right:70px;top:70px;display:grid;grid-template-columns:repeat(4,1fr);gap:64px}
.c{position:relative;height:252px;background:var(--card);border:2px solid var(--line);border-radius:24px;padding:26px 28px}
.n{width:40px;height:40px;border-radius:50%;background:var(--ink);color:#fff;font-weight:700;font-size:20px;display:flex;align-items:center;justify-content:center}
.t{font-size:36px;font-weight:700;letter-spacing:-.01em;margin-top:18px;height:46px;line-height:46px;white-space:nowrap}
.s{font-size:23px;line-height:1.38;color:var(--mute);margin-top:10px;text-wrap:balance;min-height:64px}
.c.cmd{background:var(--ink);border-color:var(--ink)}.c.cmd .n{background:#fff;color:var(--ink)}.c.cmd .t{color:#fff}.c.cmd .s{color:#B9C5D1}
.c.ok{border-color:#7CC4A6;background:#F4FBF8}.c.ok .n{background:var(--green)}.c.ok .t{color:var(--green)}
.c:not(:last-child)::after{content:"";position:absolute;right:-64px;top:50%;width:64px;height:2px;background:#B6C0CA}
.c:not(:last-child)::before{content:"";position:absolute;right:-64px;top:calc(50% - 6px);width:12px;height:12px;border-top:2px solid #B6C0CA;border-right:2px solid #B6C0CA;transform:rotate(45deg) translate(-2px,2px)}
</style>
<div id=frame class=frame><div class=ruler></div><div class=row>
 <div class=c><div class=n>1</div><div class=t>You work</div><div class=s>Write, build or review any post or page</div></div>
 <div class=c><div class=n>2</div><div class=t>Adams loads</div><div class=s>Only the module the task needs, no more</div></div>
 <div class="c cmd"><div class=n>3</div><div class="t mono" style="font-size:33px;letter-spacing:-.02em">adams check</div><div class=s>Picks the right check for each file or URL</div></div>
 <div class="c ok"><div class=n>4</div><div class=t>Clean</div><div class=s>Fixes every hit and checks again until clean</div></div>
</div></div>
