<!doctype html><meta charset=utf-8><meta name=scale content=1><link rel=stylesheet href=base.css>
<style>
#frame{width:1280px;height:640px;border-radius:0;border-width:0}
.left{position:absolute;left:76px;top:130px}
.pill{display:inline-block;font-size:17px;letter-spacing:.16em;font-weight:600;color:var(--mute);border:2px solid #C9D1D9;border-radius:999px;padding:8px 18px;background:#F7F9FA}
h1{font-size:190px;font-weight:800;letter-spacing:-.045em;line-height:.92;margin-top:24px}
.tag{font-size:40px;font-weight:500;color:var(--ink2);margin-top:22px;line-height:1.2}
.card{position:absolute;left:828px;top:140px;width:376px;background:var(--card);border:2px solid var(--line);border-radius:24px;padding:24px 28px 26px}
.hd{display:flex;align-items:center;justify-content:space-between;height:30px;margin-bottom:14px}
.chip{font-size:14px;font-weight:700;letter-spacing:.14em;padding:5px 13px;border-radius:999px}
.chip.r{color:var(--red);background:var(--red-bg)}.chip.g{color:var(--green);background:var(--green-bg)}
.note{font-size:16px;font-weight:600}.note.r{color:var(--red)}.note.g{color:var(--green)}
.rows{display:flex;flex-direction:column;gap:11px}.b{height:12px;border-radius:6px;background:var(--bar)}
.lastrow{position:relative;height:12px}.orph{width:9%;background:var(--red)}
.ring{position:absolute;left:-7px;top:-7px;width:calc(9% + 14px);height:26px;border:2.5px solid var(--red);border-radius:13px}
.fixed{width:58%;background:#5FB794}.sep{height:0;border-top:2px dashed var(--line);margin:18px 0 20px}
</style>
<div id=frame class=frame><div class=ruler></div>
<div class=left><span class=pill>SKILL FOR CLAUDE CODE AND COPILOT CLI</span><h1>Adams</h1><div class=tag>Checks every draft<br>before it ships.</div></div>
<div class=card>
 <div><div class=hd><span class="chip r">BEFORE</span><span class="note r mono">1 orphan word</span></div>
  <div class=rows><div class=b style="width:100%"></div><div class=b style="width:97%"></div><div class=b style="width:100%"></div><div class=lastrow><div class="b orph"></div><span class=ring></span></div></div></div>
 <div class=sep></div>
 <div><div class=hd><span class="chip g">AFTER</span><span class="note g mono">balanced</span></div>
  <div class=rows><div class=b style="width:100%"></div><div class=b style="width:97%"></div><div class=b style="width:100%"></div><div class="b fixed"></div></div></div>
</div></div>
