name: release
on:
  push:
    tags: ["v*"]
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Selftest
        run: python3 scripts/selftest.py --full
      - name: The tag must match VERSION
        run: test "v$(cat VERSION)" = "${GITHUB_REF_NAME}"
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 scripts/update.py notes "$(cat VERSION)" > notes.md
          test -s notes.md
          gh release create "$GITHUB_REF_NAME" --title "Adams $(cat VERSION)" --notes-file notes.md
