name: selftest
on:
  push:
    branches: [main]
  pull_request:
jobs:
  selftest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Selftest (a fresh clone must pass)
        run: python3 scripts/selftest.py --full
      - name: Validate manifests are JSON
        run: python3 -c "import json,glob;[json.load(open(f)) for f in glob.glob('.claude-plugin/*.json')+glob.glob('plugins/*/.claude-plugin/*.json')+glob.glob('config/profiles/*.json')+['hooks/hooks.json']]"
